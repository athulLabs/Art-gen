<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Void Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508;
            color: #e1e1e6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9494a0;
            font-weight: 500;
        }
        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #09090e;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f0f0f5, #c5c5d0);
            color: #050508;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cinematic Void</h1>
        <canvas id="artCanvas" width="600" height="600"></canvas>
        <button onclick="generateCinematicArt()">Regenerate</button>
    </div>

    <script>
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');

        function generateCinematicArt() {
            // Deep void background
            ctx.fillStyle = '#07070c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Cinematic color grading palettes (Earthy mineral, high-contrast gold, deep space cyan/amber)
            const palettes = [
                ['#e6c687', '#b38f54', '#ff7733', '#ffffff', '#331a00'], // Warm Amber & Gold
                ['#00ffff', '#3388ff', '#9900ff', '#ffffff', '#0a0a23'], // Deep Void Cyan
                ['#ff3366', '#ff9933', '#ffcc00', '#ffffff', '#260d0d']  // High Contrast Chiaroscuro
            ];
            const palette = palettes[Math.floor(Math.random() * palettes.length)];

            // 1. Draw atmospheric background glow/nebula effect
            let gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, canvas.width / 1.5);
            gradient.addColorStop(0, palette[4]);
            gradient.addColorStop(1, '#07070c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw floating cinematic dust particles
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = palette[Math.floor(Math.random() * (palette.length - 1))];
                ctx.globalAlpha = Math.random() * 0.5 + 0.1;
                let px = Math.random() * canvas.width;
                let py = Math.random() * canvas.height;
                let pSize = Math.random() * 2.5;
                ctx.beginPath();
                ctx.arc(px, py, pSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0; // Reset alpha

            // 3. Draw structured, low-angle geometric focus rings
            const rings = 12;
            for (let i = 0; i < rings; i++) {
                let radius = (canvas.width / 2.2) - (i * 20);
                if (radius <= 10) break;

                ctx.beginPath();
                ctx.lineWidth = Math.random() * 3 + 0.5;
                ctx.strokeStyle = palette[Math.floor(Math.random() * (palette.length - 1))];
                
                // Add cinematic shadow/glow to strokes
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 10;

                let startAngle = Math.random() * Math.PI * 2;
                let arcLength = Math.random() * (Math.PI * 1.5) + (Math.PI * 0.5);
                
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + arcLength);
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow
            }

            // 4. Draw central focal point (The Core)
            ctx.beginPath();
            let coreRadius = Math.random() * 15 + 8;
            let coreGradient = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, coreRadius);
            coreGradient.addColorStop(0, '#ffffff');
            coreGradient.addColorStop(0.5, palette[0]);
            coreGradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = coreGradient;
            ctx.arc(centerX, centerY, coreRadius * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Run on load
        generateCinematicArt();
    </script>
</body>
</html>
