<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Camera Studio</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #f0f0f5;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #d4d4f7;
        }
        .canvas-container {
            width: 85vw;
            max-width: 360px;
            aspect-ratio: 9 / 16;
            background: linear-gradient(135deg, #1e1e2f, #0d0d14);
            border: 2px solid #4f46e5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
        }
        /* Rule of thirds grid lines for cinematic framing */
        .grid-line-h, .grid-line-v {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .grid-line-h { width: 100%; height: 1px; }
        .grid-line-h1 { top: 33.33%; }
        .grid-line-h2 { top: 66.66%; }
        .grid-line-v { height: 100%; width: 1px; }
        .grid-line-v1 { left: 33.33%; }
        .grid-line-v2 { left: 66.66%; }

        .viewfinder-text {
            z-index: 2;
            color: #a5b4fc;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:active {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <h1>Cinematic Shot Studio</h1>
    
    <div class="canvas-container" id="viewfinder">
        <!-- Cinematic Grid Lines -->
        <div class="grid-line-h grid-line-h1"></div>
        <div class="grid-line-h grid-line-h2"></div>
        <div class="grid-line-v grid-line-v1"></div>
        <div class="grid-line-v grid-line-v2"></div>
        
        <div class="viewfinder-text" id="statusText">REC 9:16</div>
    </div>

    <div class="controls">
        <button onclick="triggerSnapshot()">Take Snapshot</button>
    </div>

    <script>
        function triggerSnapshot() {
            const viewfinder = document.getElementById('viewfinder');
            const statusText = document.getElementById('statusText');
            
            // Flash effect
            viewfinder.style.backgroundColor = '#ffffff';
            statusText.style.color = '#000000';
            statusText.innerText = 'SAVED';
            
            setTimeout(() => {
                viewfinder.style.background = 'linear-gradient(135deg, #1e1e2f, #0d0d14)';
                statusText.style.color = '#a5b4fc';
                statusText.innerText = 'REC 9:16';
            }, 200);
        }
    </script>

</body>
</html>
