<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotCraft - Virtual Cinematic Camera Studio</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #f0f0f5;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #d4d4f7;
            text-align: center;
        }
        .canvas-container {
            width: 80vw;
            max-width: 320px;
            aspect-ratio: 9 / 16;
            background: linear-gradient(135deg, #1e1e2f, #0d0d14);
            border: 2px solid #4f46e5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        /* Cinematic Grid Lines */
        .grid-line-h, .grid-line-v {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.15);
        }
        .grid-line-h { width: 100%; height: 1px; }
        .grid-line-h1 { top: 33.33%; }
        .grid-line-h2 { top: 66.66%; }
        .grid-line-v { height: 100%; width: 1px; }
        .grid-line-v1 { left: 33.33%; }
        .grid-line-v2 { left: 66.66%; }

        .viewfinder-overlay {
            z-index: 2;
            text-align: center;
            padding: 10px;
        }
        .viewfinder-text {
            color: #a5b4fc;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .lens-info {
            color: #818cf8;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        /* Control Panel Styles */
        .controls-panel {
            width: 85vw;
            max-width: 340px;
            margin-top: 15px;
            background: #12121a;
            border: 1px solid #2a2a3d;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #4f46e5;
        }
        .action-button {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-button:active {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <h1>ShotCraft Studio</h1>
    
    <div class="canvas-container" id="viewfinder">
        <div class="grid-line-h grid-line-h1"></div>
        <div class="grid-line-h grid-line-h2"></div>
        <div class="grid-line-v grid-line-v1"></div>
        <div class="grid-line-v grid-line-v2"></div>
        
        <div class="viewfinder-overlay">
            <div class="viewfinder-text" id="statusText">REC 9:16</div>
            <div class="lens-info" id="lensDisplay">35mm • f/2.8</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label><span>Focal Length</span> <span id="focalVal">35mm</span></label>
            <input type="range" id="focalRange" min="18" max="85" value="35" oninput="updateLens()">
        </div>
        <div class="control-group">
            <label><span>Aperture (DOF)</span> <span id="apertureVal">f/2.8</span></label>
            <input type="range" id="apertureRange" min="1" max="16" step="0.5" value="2.8" oninput="updateAperture()">
        </div>
        <button class="action-button" onclick="triggerSnapshot()">Take Snapshot</button>
    </div>

    <script>
        function updateLens() {
            const val = document.getElementById('focalRange').value;
            document.getElementById('focalVal').innerText = val + 'mm';
            updateLensDisplay();
        }

        function updateAperture() {
            const val = document.getElementById('apertureRange').value;
            document.getElementById('apertureVal').innerText = 'f/' + val;
            updateLensDisplay();
        }

        function updateLensDisplay() {
            const f = document.getElementById('focalRange').value;
            const a = document.getElementById('apertureRange').value;
            document.getElementById('lensDisplay').innerText = f + 'mm • f/' + a;
            
            // Scale viewfinder slightly based on focal length to simulate optical zoom
            const viewfinder = document.getElementById('viewfinder');
            const scale = 1 + ((f - 35) * 0.0015);
            viewfinder.style.transform = `scale(${scale})`;
        }

        function triggerSnapshot() {
            const viewfinder = document.getElementById('viewfinder');
            const statusText = document.getElementById('statusText');
            
            viewfinder.style.backgroundColor = '#ffffff';
            statusText.style.color = '#000000';
            statusText.innerText = 'SAVED';
            
            setTimeout(() => {
                viewfinder.style.background = 'linear-gradient(135deg, #1e1e2f, #0d0d14)';
                statusText.style.color = '#a5b4fc';
                statusText.innerText = 'REC 9:16';
            }, 200);
        }
    </script>

</body>
</html>
