<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AI Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508;
            color: #f0f0f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9494a0;
            font-weight: 500;
        }
        .frame {
            width: 100%;
            aspect-ratio: 9 / 16;
            background-color: #0b0b12;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9494a0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f0f0f5, #c5c5d0);
            color: #050508;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cinematic Void</h1>
        <div class="frame">
            <div class="loading" id="loadingText">Generating AI Art...</div>
            <img id="aiImage" alt="AI Generated Art" onload="hideLoading()">
        </div>
        <button onclick="generateNewArt()">Generate New Frame</button>
    </div>

    <script>
        // Curated cinematic, high-contrast, and traditional fusion prompts
        const artPrompts = [
            "dark cinematic void background, low-angle worm's eye perspective, glowing neon architectural lines, high contrast chiaroscuro lighting, 9:16",
            "traditional kerala mural art style, natural mineral pigments, aged lime-plaster temple wall texture, dark atmospheric background, 9:16",
            "modest old tiled-roof house during gentle monsoon rain, CRT television glowing softly in the dark room, cinematic mood, 9:16",
            "abstract glowing golden dust particles floating in deep space, high contrast dark minimalist background, cinematic atmosphere, 9:16",
            "cyberpunk neon aesthetic, moody dark rainy street reflection, cinematic color grading, 9:16"
        ];

        function hideLoading() {
            document.getElementById('loadingText').style.display = 'none';
        }

        function generateNewArt() {
            document.getElementById('loadingText').style.display = 'block';
            const randomPrompt = artPrompts[Math.floor(Math.random() * artPrompts.length)];
            
            // Adds a timestamp parameter to force the browser to load the fresh image instead of cached version
            const timestamp = new Date().getTime();
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(randomPrompt)}?seed=${timestamp}`;
            
            document.getElementById('aiImage').src = imageUrl;
        }

        // Generate first image on page load
        generateNewArt();
    </script>
</body>
</html>
