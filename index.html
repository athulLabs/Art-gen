<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Camera Studio</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #f0f0f5;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .canvas-container {
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: linear-gradient(135deg, #1a1a24, #050508);
            border: 2px solid #2a2a3d;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #d4d4f7;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <h1>Cinematic Shot Studio</h1>
    
    <div class="canvas-container" id="viewfinder">
        <p style="color: #6b6b83; font-size: 0.9rem;">Viewfinder Ready</p>
    </div>

    <div class="controls">
        <button onclick="triggerFlash()">Snapshot</button>
    </div>

    <script>
        function triggerFlash() {
            const viewfinder = document.getElementById('viewfinder');
            viewfinder.style.backgroundColor = '#ffffff';
            setTimeout(() => {
                viewfinder.style.backgroundColor = '';
            }, 150);
        }
    </script>

</body>
</html>
